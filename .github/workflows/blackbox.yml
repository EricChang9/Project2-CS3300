name: Black-box assignment tests
on:
  pull_request:
    paths:
      - 'tests/blackbox/**'
      - 'backend/src/test/java/edu/group17/roommates/blackbox/**'
      - 'docs/testing/**'
      - 'firebase.blackbox.json'
      - '.github/workflows/blackbox.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blackbox:
    # Playwright 1.58.2 supports Ubuntu 24.04; avoid runner OS drift.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/blackbox/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm --prefix frontend ci
      - run: npm --prefix tests/blackbox ci
      - run: npx playwright install --with-deps chromium
        working-directory: tests/blackbox
      - name: Run against an ephemeral Firestore emulator
        env:
          BB_EVIDENCE_OUTPUT: ${{ runner.temp }}/blackbox-evidence.json
        run: npx --yes firebase-tools@13.30.0 emulators:exec --only firestore --config firebase.blackbox.json --project demo-blackbox-suite 'python3 tests/blackbox/run.py --emulator-host 127.0.0.1:18082'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sanitized-blackbox-evidence
          # Upload only evidence generated by this run, even when setup fails.
          path: ${{ runner.temp }}/blackbox-evidence.json
          if-no-files-found: warn
